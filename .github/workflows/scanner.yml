# Mode secours : un passage de paper trading de l'or sur les serveurs de GitHub (gratuit, sans serveur).
# Inutile si le bot tourne déjà en continu ailleurs (Bot-Hosting…) : laisse ce workflow désactivé,
# sinon les trades seraient publiés en double.
# Configuration : Settings → Secrets and variables → Actions → Secrets : TELEGRAM_BOT_TOKEN, TELEGRAM_CHANNEL_ID
name: Paper trading or

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: # bouton « Run workflow » pour lancer à la main

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  gold:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --omit=dev

      # Mémoire entre deux passages : positions ouvertes et historique des trades
      - name: Restaurer la mémoire
        uses: actions/cache/restore@v4
        with:
          path: data
          key: gold-data-${{ github.run_id }}
          restore-keys: gold-data-

      - name: Paper trading
        run: node once.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          DATA_DIR: data
          GOLD_SIZE_USD: ${{ vars.GOLD_SIZE_USD }}
          GOLD_FEE_PCT: ${{ vars.GOLD_FEE_PCT }}
          GOLD_STRATEGIES: ${{ vars.GOLD_STRATEGIES }}
          SUMMARY_HOURS: ${{ vars.SUMMARY_HOURS }}

      - name: Sauvegarder la mémoire
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: gold-data-${{ github.run_id }}
